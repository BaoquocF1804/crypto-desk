base_currency: USDT
database: data/crypto_desk.sqlite3
artifacts: artifacts/crypto

symbols: [BTCUSDT, ETHUSDT, BNBUSDT, SOLUSDT, SUIUSDT]
coingecko_ids:
  BTCUSDT: bitcoin
  ETHUSDT: ethereum
  BNBUSDT: binancecoin
  SOLUSDT: solana
  SUIUSDT: sui
# analyze/daily yêu cầu ít nhất một RSS feed có tin trong 48 giờ gần nhất;
# để trống news_feeds thì mọi phiên phân tích sẽ trả về NO_TRADE.
# Ví dụ (chú ý: không có dấu "/" cuối URL CoinDesk — bản có "/" trả HTTP 308):
# news_feeds:
#   - https://www.coindesk.com/arc/outboundfeeds/rss
#   - https://cointelegraph.com/rss
news_feeds: []

models:
  # provider hỗ trợ: gemini (AI Studio hoặc Vertex AI), vertexai, hoặc openai
  # Với Vertex AI: có thể dùng gemini-2.5-flash, gemini-2.0-flash, gemini-1.5-flash, v.v.
  provider: gemini
  quick: gemini-3.6-flash
  deep: gemini-3.6-flash
  quick_thinking: low
  deep_thinking: high
  debate_rounds: 2

risk:
  per_trade: 0.005
  max_symbol: 0.20
  max_gross: 0.80
  min_usdt_reserve: 0.20
  max_quote_deviation: 0.005
  mainnet_initial_order_cap_usdt: "25"
  ticket_ttl_minutes: 30

binance:
  environment: testnet

schedule:
  daily_utc: "00:15"
  health_minutes: 15

telegram_allowlist: []
