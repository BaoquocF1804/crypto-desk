[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crypto-desk"
version = "0.2.0"
description = "A human-approved Binance Spot crypto research and execution desk"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "binance-sdk-spot==10.0.0",
  "httpx==0.28.1",
  "openai==2.45.0",
  "pydantic==2.13.4",
  "python-dotenv==1.2.1",
  "PyYAML==6.0.2",
  "typer==0.21.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.15.5"]

[project.scripts]
desk = "crypto_desk.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--capture=sys"

[tool.ruff]
line-length = 100
target-version = "py312"
